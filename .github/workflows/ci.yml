name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/ci_database?schema=public
      SHOPIFY_API_KEY: ci-client-id
      SHOPIFY_API_SECRET: ci-api-secret
      SHOPIFY_APP_URL: https://ci.invalid
      SCOPES: write_customers,write_app_proxy
      ACCESS_CODE_HASH_SECRET: ci-access-code-hash-secret-at-least-32-characters
      CUSTOMER_CSRF_SECRET: ci-customer-csrf-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
